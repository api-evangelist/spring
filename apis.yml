apis:
- name: Spring Data REST API
  description: Spring Data REST automatically exports Spring Data repository interfaces as RESTful hypermedia-driven
    APIs using HAL (Hypertext Application Language). It enables CRUD operations on domain entities through discoverable
    REST endpoints without writing controller code. The API supports HATEOAS linking, projections, validation, and
    event hooks.
  humanUrl: https://spring.io/projects/spring-data-rest
  baseUrl: https://api.spring.io/data/rest
  tags:
  - CRUD
  - Data
  - HATEOAS
  - Hypermedia
  - REST
