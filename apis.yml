    url: https://github.com/spring-cloud/spring-cloud-gateway/tree/main/spring-cloud-gateway-sample
- name: Spring Authorization Server API
  description: Spring Authorization Server provides a full OAuth 2.1 and OpenID Connect 1.0 authorization server
    implementation built on Spring Security. It supports authorization code flow, client credentials, device authorization,
    token introspection, and token revocation. Exposes standard OAuth 2 endpoints.
  humanUrl: https://spring.io/projects/spring-authorization-server
  baseUrl: https://api.spring.io/oauth
  tags:
  - Authorization
  - Authentication
  - OpenID Connect
  - Security
  tags_raw:
