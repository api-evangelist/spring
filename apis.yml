- name: Spring AI API
  description: Spring AI provides a Spring-friendly API and abstractions for building AI-powered applications. It
    offers a unified ChatClient API for interacting with AI models (OpenAI, Anthropic, Google Gemini, Ollama, and
    others), along with vector store integrations, prompt templates, output parsers, and function calling support.
    Follows portable, modular Spring design principles.
  humanUrl: https://spring.io/projects/spring-ai
  baseUrl: https://api.spring.io/ai
  tags:
