- name: Spring Cloud Gateway API
  description: Spring Cloud Gateway provides an API Gateway built on Spring WebFlux and Reactor. It offers route
    configuration, request/response filtering, load balancing, circuit breaking, rate limiting, and retry capabilities
    via a fluent Java DSL or YAML configuration. The Actuator endpoint exposes live route and filter information.
  humanUrl: https://spring.io/projects/spring-cloud-gateway
  baseUrl: https://api.spring.io/gateway
  tags:
  - API Gateway
  - Cloud
  - Load Balancing
  - Routing
  - Security
