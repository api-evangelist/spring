specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Spring Framework
providerId: spring
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Framework
  - Java
  - Open Source
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps placeholder for the Spring Framework. The
  framework itself has no consumption cost; the FinOps surface lives in the
  optional Tanzu Spring support contract and in the cloud / runtime cost of
  applications built with Spring.
sources:
  - https://spring.io/
  - https://enterprise.spring.io/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Broadcom Inc. (VMware Tanzu)
serviceCategory: Open-Source Framework
billingModel:
  pricingCategory: Contact Sales
  billingFrequency: Per-Contract
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Spring Framework
  ServiceCategory: Open-Source Framework
  ProviderName: Spring (VMware Tanzu)
  PublisherName: Broadcom Inc.
  InvoiceIssuerName: Broadcom Inc.
  BillingCurrency: USD
meters:
  - name: tanzu_spring_support
    description: Tanzu Spring / Spring Enterprise support subscription. Billing
      basis is contractual (typically per-application or per-VM); not publicly
      disclosed.
    unit: varies
    aggregation: sum
    dimensions:
      - support_tier
principles:
  - name: Visibility
    description: The framework itself has no usage telemetry. FinOps visibility
      lives downstream — APM (e.g. JFR, Micrometer to Prometheus / Datadog) for
      runtime cost, and the Tanzu support contract for the support fee line.
  - name: Allocation
    description: Allocate Tanzu Spring support against the platform team that
      contracts the subscription; allocate runtime cost of Spring applications
      to the workload team via cloud-account / namespace tagging.
  - name: Optimization
    description: At the framework level, optimize startup time and memory (GraalVM
      native images, Spring Boot lazy initialization, AOT processing) to reduce
      cloud runtime cost. At the support level, scope the Tanzu subscription to
      production application count rather than dev/test.
  - name: Accountability
    description: Tanzu support cost owned by the platform team; per-application
      runtime cost owned by the application team that operates each service.
notes: Open-source framework; per-call FinOps applies to the consuming
  application's runtime, not to Spring itself.
maintainers:
  - name: VMware Tanzu (Broadcom)
    email: spring-team@vmware.com
    url: https://spring.io/team
