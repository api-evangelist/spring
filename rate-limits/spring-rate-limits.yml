specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Spring Framework
providerId: spring
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Framework
  - Java
  - Open Source
  - Rate Limiting
description: Spring Framework is a self-hosted open-source library, not a hosted
  API service. There is no provider-imposed rate limit on Spring itself — any
  throttling, quota, or back-pressure exists in the application built with
  Spring (e.g. via Spring Cloud Gateway, Bucket4j, Resilience4j) and is the
  application owner's responsibility.
sources:
  - https://spring.io/
  - https://docs.spring.io/spring-framework/reference/
notes: Self-hosted framework; rate limiting belongs to the deploying application.
responseCodes:
  throttled: 429
limits:
  - name: Application-Defined
    scope: application
    metric: varies
    limit: defined by the application built on Spring
    notes: Spring exposes no global throughput cap; teams add limits with
      Spring Cloud Gateway request-rate filters, Bucket4j, Resilience4j, or
      reverse-proxy throttling.
policies:
  - name: Self-Hosted Throttling
    description: Spring applications implement their own rate limiting. Common
      patterns are Spring Cloud Gateway's RequestRateLimiter (Redis-backed),
      Bucket4j with token-bucket semantics, and Resilience4j RateLimiter
      decorators on service methods.
maintainers:
  - name: VMware Tanzu (Broadcom)
    email: spring-team@vmware.com
    url: https://spring.io/team
