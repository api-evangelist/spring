naftiko: 1.0.0-alpha2
info:
  label: Spring Boot Actuator API — Info
  description: 'Spring Boot Actuator API — Info. 1 operations. Lead operation: Get Application Info. Self-contained Naftiko
    capability covering one Spring business surface.'
  tags:
  - Spring
  - Info
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_API_KEY: SPRING_API_KEY
capability:
  consumes:
  - type: http
    namespace: boot-actuator-info
    baseUri: http://localhost:8080/actuator
    description: Spring Boot Actuator API — Info business capability. Self-contained, no shared references.
    resources:
    - name: info
      path: /info
      operations:
      - name: getinfo
        method: GET
        description: Get Application Info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.SPRING_USER}}'
      password: '{{env.SPRING_PASS}}'
  exposes:
  - type: rest
    namespace: boot-actuator-info-rest
    port: 8080
    description: REST adapter for Spring Boot Actuator API — Info. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/info
      name: info
      description: REST surface for info.
      operations:
      - method: GET
        name: getinfo
        description: Get Application Info
        call: boot-actuator-info.getinfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: boot-actuator-info-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Boot Actuator API — Info. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-application-info
      description: Get Application Info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: boot-actuator-info.getinfo
      outputParameters:
      - type: object
        mapping: $.
