naftiko: 1.0.0-alpha2
info:
  label: Spring Boot Actuator API — Loggers
  description: 'Spring Boot Actuator API — Loggers. 3 operations. Lead operation: List Loggers. Self-contained Naftiko capability
    covering one Spring business surface.'
  tags:
  - Spring
  - Loggers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_API_KEY: SPRING_API_KEY
capability:
  consumes:
  - type: http
    namespace: boot-actuator-loggers
    baseUri: http://localhost:8080/actuator
    description: Spring Boot Actuator API — Loggers business capability. Self-contained, no shared references.
    resources:
    - name: loggers
      path: /loggers
      operations:
      - name: listloggers
        method: GET
        description: List Loggers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: loggers-name
      path: /loggers/{name}
      operations:
      - name: getlogger
        method: GET
        description: Get Logger Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Logger name (e.g., com.example.MyService, ROOT)
          required: true
      - name: setloggerlevel
        method: POST
        description: Set Logger Level
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: Logger name
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.SPRING_USER}}'
      password: '{{env.SPRING_PASS}}'
  exposes:
  - type: rest
    namespace: boot-actuator-loggers-rest
    port: 8080
    description: REST adapter for Spring Boot Actuator API — Loggers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/loggers
      name: loggers
      description: REST surface for loggers.
      operations:
      - method: GET
        name: listloggers
        description: List Loggers
        call: boot-actuator-loggers.listloggers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/loggers/{name}
      name: loggers-name
      description: REST surface for loggers-name.
      operations:
      - method: GET
        name: getlogger
        description: Get Logger Configuration
        call: boot-actuator-loggers.getlogger
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: setloggerlevel
        description: Set Logger Level
        call: boot-actuator-loggers.setloggerlevel
        with:
          name: rest.name
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: boot-actuator-loggers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Boot Actuator API — Loggers. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-loggers
      description: List Loggers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: boot-actuator-loggers.listloggers
      outputParameters:
      - type: object
        mapping: $.
    - name: get-logger-configuration
      description: Get Logger Configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: boot-actuator-loggers.getlogger
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: set-logger-level
      description: Set Logger Level
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: boot-actuator-loggers.setloggerlevel
      with:
        name: tools.name
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
