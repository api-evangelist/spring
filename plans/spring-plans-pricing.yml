description: The Spring Framework itself is open-source software (Apache 2.0)
  with no per-call or subscription pricing. Commercial offerings around Spring —
  notably Tanzu Spring Runtime / Spring Enterprise from Broadcom — are sold on
  custom terms (typically per-application or per-VM support subscriptions) with
  pricing disclosed only via direct sales engagement.
